name: Build English EXE
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
      - name: Build release
        run: cargo +stable build --locked --release --bin daozai --target x86_64-pc-windows-msvc
      - name: Upload daozai.exe
        uses: actions/upload-artifact@v4
        with:
          name: Daozai-English
          path: target/x86_64-pc-windows-msvc/release/daozai.exe
